[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slarda-rain-domain-adaptation"
version = "0.1.0"
description = "SLARDA experiments for hourly rain prediction across Hanoi and Hai Phong"
requires-python = ">=3.10,<3.13"
dependencies = [
  "einops>=0.7,<1",
  "mat4py>=0.6,<1",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<30",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
publish = ["kaggle>=1.6,<2", "six>=1.16,<2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["Self-supervised training", "Autorgressive_Adaptation"]

[tool.ruff.lint]
select = ["E", "F", "I"]
