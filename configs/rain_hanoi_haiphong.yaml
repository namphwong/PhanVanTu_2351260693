project:
  name: vietnam_hourly_rain_domain_adaptation
  task: binary_next_hour_rain
  timezone: Asia/Bangkok

data:
  timezone: Asia/Bangkok
  model: era5
  cities:
    hanoi:
      latitude: 21.0278
      longitude: 105.8342
    hai_phong:
      latitude: 20.8449
      longitude: 106.6881
  source_domain: hanoi
  target_domain: hai_phong
  domain_ids:
    a: hanoi
    b: hai_phong
  start: "2023-01-01T00:00:00+07:00"
  end: "2025-12-31T23:00:00+07:00"
  frequency: 1h
  window_hours: 24
  precipitation_threshold_mm: 0.1
  label_column: rain_next_hour
  raw_dir: data/raw
  processed_dir: data/processed

splits:
  source_train: ["2023-01-01", "2024-06-30"]
  source_validation: ["2024-07-01", "2024-09-30"]
  source_test: ["2024-10-01", "2024-12-31"]
  target_adaptation_unlabeled: ["2023-01-01", "2024-12-31"]
  target_final_test: ["2025-01-01", "2025-12-31"]

model:
  encoder: facebook/dinov3-vits16-pretrain-lvd1689m
  input_channels: 11
  num_classes: 2
  backbone_frozen: true
  weather_raster_size: 224
  weather_raster_channels: 3

phase2:
  batch_size: 512
  epochs: 8
  learning_rate: 0.001
  weight_decay: 0.0003
  patience: 3
  adaptation_learning_rate: 0.0001
  discriminator_learning_rate: 0.0001
  pseudo_label_weight: 0.1
  confidence_threshold: 0.9
  teacher_momentum: 0.996
  adversarial_weight: 1.0
  num_threads: 4

reproducibility:
  seeds: [17, 23, 42]
  fit_scaler_on: source_train_only
